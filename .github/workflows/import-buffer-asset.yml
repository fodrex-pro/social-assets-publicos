name: Import Buffer Asset

on:
  push:
    paths:
      - automation/import-buffer-asset.json

permissions:
  contents: write

jobs:
  import_asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(jq -r '.source_url' automation/import-buffer-asset.json)"
          DESTINATION="$(jq -r '.destination' automation/import-buffer-asset.json)"
          if [ -z "$SOURCE_URL" ] || [ "$SOURCE_URL" = "null" ] || [ -z "$DESTINATION" ] || [ "$DESTINATION" = "null" ]; then
            echo 'Missing source_url or destination' >&2
            exit 1
          fi
          mkdir -p "$(dirname "$DESTINATION")"
          curl --fail --location --silent --show-error "$SOURCE_URL" -o "$DESTINATION"
          test "$(wc -c < "$DESTINATION")" -gt 10000
          MIME="$(file --brief --mime-type "$DESTINATION")"
          case "$MIME" in
            image/jpeg|image/png|image/webp) ;;
            *) echo "Unexpected MIME: $MIME" >&2; exit 1 ;;
          esac

      - name: Commit public asset
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION="$(jq -r '.destination' automation/import-buffer-asset.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DESTINATION"
          git diff --cached --quiet && exit 0
          git commit -m "Import Buffer asset: $DESTINATION"
          git push
