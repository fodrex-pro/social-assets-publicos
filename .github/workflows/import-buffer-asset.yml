name: Import Buffer Asset

on:
  push:
    paths:
      - automation/import-buffer-asset.json

permissions:
  contents: write

jobs:
  import_asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved assets
        shell: bash
        run: |
          set -euo pipefail

          if jq -e '.assets and (.assets | type == "array") and (.assets | length > 0)' automation/import-buffer-asset.json >/dev/null; then
            jq -c '.assets[]' automation/import-buffer-asset.json > /tmp/buffer-assets.jsonl
          else
            jq -c '{source_url: .source_url, source_base64: .source_base64, destination: .destination}' automation/import-buffer-asset.json > /tmp/buffer-assets.jsonl
          fi

          COUNT=0
          while IFS= read -r ITEM; do
            SOURCE_URL="$(printf '%s' "$ITEM" | jq -r '.source_url // empty')"
            SOURCE_BASE64="$(printf '%s' "$ITEM" | jq -r '.source_base64 // empty')"
            DESTINATION="$(printf '%s' "$ITEM" | jq -r '.destination // empty')"

            if [ -z "$DESTINATION" ]; then
              echo 'Missing destination' >&2
              exit 1
            fi
            if [ -z "$SOURCE_URL" ] && [ -z "$SOURCE_BASE64" ]; then
              echo 'Missing source_url or source_base64' >&2
              exit 1
            fi

            mkdir -p "$(dirname "$DESTINATION")"
            if [ -n "$SOURCE_BASE64" ]; then
              printf '%s' "$SOURCE_BASE64" | base64 --decode > "$DESTINATION"
            else
              curl --fail --location --silent --show-error "$SOURCE_URL" -o "$DESTINATION"
            fi

            test "$(wc -c < "$DESTINATION")" -gt 10000
            MIME="$(file --brief --mime-type "$DESTINATION")"
            case "$MIME" in
              image/jpeg|image/png|image/webp) ;;
              *) echo "Unexpected MIME for $DESTINATION: $MIME" >&2; exit 1 ;;
            esac
            COUNT=$((COUNT + 1))
            echo "Imported $COUNT: $DESTINATION ($MIME)"
          done < /tmp/buffer-assets.jsonl

          test "$COUNT" -gt 0

      - name: Commit public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if jq -e '.assets and (.assets | type == "array") and (.assets | length > 0)' automation/import-buffer-asset.json >/dev/null; then
            while IFS= read -r DESTINATION; do
              git add "$DESTINATION"
            done < <(jq -r '.assets[].destination' automation/import-buffer-asset.json)
          else
            git add "$(jq -r '.destination' automation/import-buffer-asset.json)"
          fi

          git diff --cached --quiet && exit 0
          git commit -m "Import Buffer assets"
          git push
